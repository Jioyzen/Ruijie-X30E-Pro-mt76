name: X30E Pro source build

"on":
  push:
    branches: [openwrt-25.12]
  workflow_dispatch:
    inputs:
      merge_upstream:
        description: Merge ImmortalWrt openwrt-25.12 before building
        type: boolean
        required: true
        default: true
      publish_release:
        description: Publish the successful build as a GitHub Release
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: x30e-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@v4
        with:
          ref: openwrt-25.12
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            python3-pyelftools rsync swig time unzip zlib1g-dev file wget \
            subversion libelf-dev zstd xsltproc

      - name: Merge upstream source
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.merge_upstream)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch upstream openwrt-25.12
          git merge --no-edit FETCH_HEAD
          git push origin HEAD:openwrt-25.12

      - name: Build and validate firmware
        env:
          JOBS: '4'
        run: ./scripts/build-x30e-pro.sh

      - name: Upload firmware and validation report
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x30e-pro-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/targets/mediatek/filogic/immortalwrt-*-ruijie_rg-x30e-pro-squashfs-factory.bin
            bin/targets/mediatek/filogic/immortalwrt-*-ruijie_rg-x30e-pro-squashfs-sysupgrade.bin
            bin/targets/mediatek/filogic/immortalwrt-*-ruijie_rg-x30e-pro-validation.json
            bin/targets/mediatek/filogic/immortalwrt-*-ruijie_rg-x30e-pro.manifest
            bin/targets/mediatek/filogic/sha256sums

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            bin/targets/mediatek/filogic/immortalwrt-*-ruijie_rg-x30e-pro-squashfs-factory.bin
            bin/targets/mediatek/filogic/immortalwrt-*-ruijie_rg-x30e-pro-squashfs-sysupgrade.bin
            bin/targets/mediatek/filogic/immortalwrt-*-ruijie_rg-x30e-pro-validation.json
            bin/targets/mediatek/filogic/immortalwrt-*-ruijie_rg-x30e-pro.manifest
            bin/targets/mediatek/filogic/sha256sums
          )
          if (( ${#files[@]} < 5 )); then
            echo "Expected release images and validation files are missing" >&2
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:7}"
          notes="Automated build ${GITHUB_RUN_NUMBER} from ${source_sha}."

          # Optional immutable, versioned release for a manual run.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" = "true" ]; then
            tag="x30e-pro-build-${GITHUB_RUN_NUMBER}-${short_sha}"
            gh release create "$tag" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$source_sha" \
              --title "Ruijie X30E Pro ImmortalWrt build ${GITHUB_RUN_NUMBER} (${short_sha})" \
              --notes "$notes"
          fi

          # Rolling release: every successful build replaces these assets.
          tag="x30e-pro-latest"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Ruijie X30E Pro ImmortalWrt (latest)" \
              --notes "$notes" --latest
          else
            gh release create "$tag" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$source_sha" \
              --title "Ruijie X30E Pro ImmortalWrt (latest)" \
              --notes "$notes" --latest
          fi
